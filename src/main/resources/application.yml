server:
  servlet:
    session:
      timeout: 14d
      cookie:
        name: TTT_SESSION
        max-age: 14d
        http-only: true
        # secure: true
        same-site: lax

spring:
  session:
    store-type: jdbc
    jdbc:
      initialize-schema: always
  jackson:
    visibility:
      field: any
      getter: none
      is-getter: none
  profiles:
    active: local
  application:
    name: ttt
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      client:
        registration:
          discord:
            client-id: ${discord.client-id}
            client-secret: ${discord.client-secret}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/discord"
            scope:
              - identify
              - guilds
            client-name: Discord
        provider:
          discord:
            authorization-uri: https://discord.com/api/oauth2/authorize
            token-uri: https://discord.com/api/oauth2/token
            user-info-uri: https://discord.com/api/users/@me
            user-name-attribute: id
ttt:
  flaresolverr:
    url: ${FLARESOLVERR_URL:http://localhost:8191/v1}
app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
# Default placeholders (overridden by application-local.yml or environment variables)
discord:
  target-guild-id: ${DISCORD_TARGET_GUILD_ID:your_guild_id_here}
  client-id: ${DISCORD_CLIENT_ID:your_client_id_here}
  client-secret: ${DISCORD_CLIENT_SECRET:your_secret_here}